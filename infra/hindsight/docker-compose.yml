# Hindsight — memória durável do Kobe (Highlander, Frente 2)
# ============================================================================
# Serviço de memória de longo prazo (retain / recall / reflect) da Vectorize
# (https://github.com/vectorize-io/hindsight, MIT). Roda em modo SERVIÇO
# (container próprio, API MCP sobre HTTP) — NÃO lib embutida — apontando pra um
# Postgres dedicado NOVO (pgvector), separado do Postgres da Evolution e do
# Supabase. Esse Postgres é o futuro lar da memória do Kobe (a migração da
# memória de trabalho vem depois; está FORA do escopo desta rodada).
#
# Decisões travadas (plano v4 §6 + operador 2026-06-24):
#   - Postgres dedicado, imagem pgvector/pgvector:pg18 (default upstream).
#   - Hindsight pinado em 0.8.3 (tag da imagem; o release no GitHub é v0.8.3,
#     mas a imagem Docker NÃO usa o 'v') — nunca :latest.
#   - Embeddings = OpenAI text-embedding-3-small (usa a OPENAI_API_KEY do Kobe).
#   - Provedor do LLM = configurável (HINDSIGHT_LLM_PROVIDER, default openai);
#     desde 29/08/2026 a produção roda `anthropic` + `claude-haiku-4-5`.
#   - Portas em LOOPBACK (127.0.0.1) — como a Evolution. Acesso externo só via
#     túnel SSH (igual pgAdmin).
#
# AMBIENTE DE VALIDAÇÃO: prod VPS (o operador não testa em dev). Subir aqui,
# rodar o smoke (smoke_test.py) aqui. Reversível: `docker compose down -v`
# apaga o container + volume sem tocar Supabase nem Evolution.
#
# Sobe:
#   cd $KOBE_HOME/infra/hindsight/
#   cp .env.example .env   # e preencha HINDSIGHT_DB_PASSWORD + OPENAI_API_KEY
#   sg docker -c "docker compose up -d"
#
# Derruba:
#   sg docker -c "docker compose down"       # mantém volume (memória)
#   sg docker -c "docker compose down -v"     # apaga a memória durável
#
# Runbook completo: README.md (mesma pasta).
# ============================================================================

# ⚠️ NOME DO PROJETO — a linha que impede o pior acidente possível aqui.
# Sem ela, o Compose deriva o nome do projeto do nome da PASTA. Duas stacks
# subindo da mesma pasta (prod com `.env`, dev com `--env-file .env.dev`)
# cairiam no mesmo projeto e nos mesmos nomes de serviço — e um `up` do dev
# RECRIARIA os containers da produção com a configuração do dev, levando a
# memória durável junto. O default `hindsight` é exatamente o que o Compose já
# resolvia sozinho, então a produção não vê diferença nenhuma.
name: ${HINDSIGHT_PROJECT_NAME:-hindsight}

services:
  hindsight-db:
    container_name: hindsight-postgres${HINDSIGHT_STACK_SUFFIX:-}
    image: pgvector/pgvector:pg${HINDSIGHT_DB_VERSION:-18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HINDSIGHT_DB_USER:-hindsight_user}
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?defina HINDSIGHT_DB_PASSWORD no .env}
      POSTGRES_DB: ${HINDSIGHT_DB_NAME:-hindsight_db}
    volumes:
      # PG18 mudou o PGDATA default pra /var/lib/postgresql/<versao>/docker —
      # montar nesse path (igual ao compose oficial external-pg do Hindsight),
      # senão o volume não persiste os dados de verdade.
      - hindsight-postgres-data:/var/lib/postgresql/${HINDSIGHT_DB_VERSION:-18}/docker
    networks:
      - hindsight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HINDSIGHT_DB_USER:-hindsight_user} -d ${HINDSIGHT_DB_NAME:-hindsight_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hindsight-app:
    container_name: hindsight-app${HINDSIGHT_STACK_SUFFIX:-}
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-0.8.3}
    restart: unless-stopped
    depends_on:
      hindsight-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HINDSIGHT_PORT_API:-8888}:8888"    # ⚠️ loopback — API MCP/HTTP
      - "127.0.0.1:${HINDSIGHT_PORT_ADMIN:-9999}:9999"  # ⚠️ loopback — admin UI (túnel SSH)
    environment:
      # --- Provedor do LLM ---
      # Default `openai` — quem não define nada continua exatamente como antes.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-openai}
      # Modelo: vazio cai no default do PROVIDER escolhido (o Hindsight resolve
      # `os.getenv(...) or default_do_provider`, então string vazia é segura).
      # Declare o modelo quando quiser fixá-lo e não depender do default da
      # imagem — que pode mudar numa versão futura sem aviso.
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-}
      # A chave do LLM tem variável PRÓPRIA. Antes ela era amarrada à
      # OPENAI_API_KEY, o que impedia apontar o LLM para qualquer outro provider
      # (anthropic, gemini, …) sem também trocar a chave dos embeddings. O
      # default preserva, letra por letra, o comportamento de antes.
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-${OPENAI_API_KEY}}
      # --- Embeddings: OpenAI text-embedding-3-small (decisão v4 §6) ---
      # Sem isto, o Hindsight cai no embedding LOCAL (onnx, BAAI/bge-small, 384d).
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_EMBEDDINGS_PROVIDER:-openai}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: text-embedding-3-small
      # ⚠️ A chave dos embeddings, amarrada SEPARADAMENTE — armadilha silenciosa.
      # Por padrão o Hindsight faz a chave de embedding CAIR na chave do LLM.
      # Então, no instante em que o LLM aponta para outro provider, os embeddings
      # passam a mandar a chave errada para a OpenAI e voltam 401 — e o `reflect`
      # NÃO falha: ele responde "não há registro", porque as ferramentas de busca
      # engolem o erro. Resposta vazia com latência bonita. Amarrar aqui é o que
      # mantém os dois eixos independentes.
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${OPENAI_API_KEY:?defina OPENAI_API_KEY no .env}
      # --- Storage: Postgres dedicado externo (pgvector) ---
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_DB_USER:-hindsight_user}:${HINDSIGHT_DB_PASSWORD:?defina HINDSIGHT_DB_PASSWORD no .env}@hindsight-db:5432/${HINDSIGHT_DB_NAME:-hindsight_db}
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
    networks:
      - hindsight-net

networks:
  hindsight-net:
    # Rede por stack: com sufixo próprio, o dev não enxerga o Postgres da prod.
    # O nome de HOST do banco continua sendo `hindsight-db` (o nome do SERVIÇO,
    # não o do container) — o Compose registra o alias por serviço, então cada
    # stack resolve o seu sem precisar de mudança nenhuma na DATABASE_URL.
    name: hindsight-net${HINDSIGHT_STACK_SUFFIX:-}
    driver: bridge

volumes:
  hindsight-postgres-data:
    # ⚠️ O nome deste volume É a memória durável. Mudar o default aqui faz o
    # próximo `up` da produção criar um volume vazio e subir um Hindsight sem
    # memória nenhuma — sem erro, sem aviso, só esquecimento. O default tem que
    # continuar sendo, letra por letra, `hindsight-postgres-data`.
    name: hindsight-postgres-data${HINDSIGHT_STACK_SUFFIX:-}
